on: [pull_request]

env:
  CARGO_TERM_COLOR: always

jobs:
  compileandtest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain:
          - stable
          - beta
    steps:
      - name: Check out Repo
        uses: actions/checkout@v4
      - name: RustUp
        run: rustup update ${{ matrix.toolchain }} && rustup default ${{ matrix.toolchain }}
      - name: Build
        run: cargo build --verbose
      - name: Run Tests
        run: cargo test --verbose
