<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" version="1.1">
  <defs>
    <!-- Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <!-- Base Document Gradient -->
    <linearGradient id="paperBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e6e6e6"/>
    </linearGradient>

    <!-- Top Gloss Gradient -->
    <linearGradient id="topGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Clean 3D Lighting Overlay (Neutral highlights/shadows to preserve exact accent color) -->
    <linearGradient id="accent3D" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="20%" stop-color="#ffffff" stop-opacity="0.0"/>
      <stop offset="80%" stop-color="#000000" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Red Margin Line Gradient -->
    <linearGradient id="redMargin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d0021b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff4a4a" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Document Clip Path to eliminate edge anti-aliasing / white noise -->
    <clipPath id="docClip">
      <rect x="4" y="4" width="56" height="56" rx="4" ry="4"/>
    </clipPath>

    <!-- Text Emboss Filter -->
    <filter id="textEmboss">
      <feOffset dx="0" dy="1" result="offset"/>
      <feFlood flood-color="#000000" flood-opacity="0.4" result="color"/>
      <feComposite operator="in" in2="SourceAlpha" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Main Icon Wrapper with Drop Shadow -->
  <g filter="url(#shadow)">
    
    <!-- Clipped Document Group (Prevents corner white-noise/artifacts) -->
    <g clip-path="url(#docClip)">
      <!-- Document Base Body -->
      <rect x="4" y="4" width="56" height="56" fill="url(#paperBg)"/>

      <!-- Notebook Horizontal Lines -->
      <g stroke="#b5bed1" stroke-width="0.4" opacity="0.85">
        <line x1="8" y1="12" x2="56" y2="12"/>
        <line x1="8" y1="18" x2="56" y2="18"/>
        <line x1="8" y1="24" x2="56" y2="24"/>
        <line x1="8" y1="30" x2="56" y2="30"/>
        <line x1="8" y1="36" x2="56" y2="36"/>
        <line x1="8" y1="42" x2="56" y2="42"/>
      </g>

      <!-- Red Vertical Margin Line -->
      <line x1="14.5" y1="4" x2="14.5" y2="44" stroke="url(#redMargin)" stroke-width="0.6"/>

      <!-- Solid Accent Banner -->
      <rect x="4" y="42" width="56" height="18" fill="{{ACCENT_COLOR}}"/>

      <!-- Accent 3D Shading & Highlight Layer -->
      <rect x="4" y="42" width="56" height="18" fill="url(#accent3D)"/>

      <!-- Accent Banner Top Inner Highlight Line -->
      <line x1="4" y1="42.5" x2="60" y2="42.5" stroke="#ffffff" stroke-width="0.75" opacity="0.45"/>

      <!-- Top Gloss Overlay -->
      <path d="M 4 12 Q 4 4 8 4 
               L 56 4 Q 60 4 60 12 
               L 60 28 
               Q 32 34 4 28 Z" 
            fill="url(#topGloss)" pointer-events="none"/>
    </g>

    <!-- Crisp Outer Borders (Drawn over clip for clean framing) -->
    <rect x="4.25" y="4.25" width="55.5" height="55.5" rx="3.75" ry="3.75" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.6"/>
    <rect x="4" y="4" width="56" height="56" rx="4" ry="4" fill="none" stroke="#b0b0b0" stroke-width="0.5"/>

    <text x="32" y="55"
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', Cantarell, sans-serif"
        font-weight="800"
        font-size="{{FONT_SIZE}}"
          fill="{{FONT_COLOR}}"
          text-anchor="middle"
          dominant-baseline="central"
          letter-spacing="0.8"
          filter="url(#textEmboss)">{{EXT}}</text>
  </g>
</svg>

