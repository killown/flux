app-id: io.github.killown.flux
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/flux/cargo
    RUST_BACKTRACE: "1"
    PKG_CONFIG_PATH: /app/lib/pkgconfig:/app/lib64/pkgconfig:/app/share/pkgconfig:/usr/lib/pkgconfig:/usr/share/pkgconfig
    CPATH: /app/include

command: flux-wrapper

finish-args:
  # Display, IPC & Process access
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=session-bus
  - --socket=system-bus

  # Network Access
  - --share=network

  # Full Unrestricted Host Filesystem Access
  - --filesystem=host
  - --filesystem=/run/host/usr/bin
  - --filesystem=/run/host/bin

  # Devices & Subsystems
  - --device=all

  # Allow spawning host commands (flatpak-spawn --host)
  - --talk-name=org.freedesktop.Flatpak

modules:
  # ── poppler (PDF thumbnails) ────────────────────────────────────────────────
  - name: poppler
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=/app
      - -DENABLE_BOOST=OFF
      - -DENABLE_CPP=OFF
      - -DENABLE_GLIB=ON
      - -DENABLE_GOBJECT_INTROSPECTION=OFF
      - -DENABLE_LIBOPENJPEG=none
      - -DENABLE_QT5=OFF
      - -DENABLE_QT6=OFF
      - -DENABLE_UNSTABLE_API_ABI_HEADERS=ON
    sources:
      - type: archive
        url: https://poppler.freedesktop.org/poppler-24.08.0.tar.xz
        sha256: 97453fbddf0c9a9eafa0ea45ac710d3d49bcf23a62e864585385d3c0b4403174

  # ── vte (embedded terminal) ─────────────────────────────────────────────────
  - name: vte
    buildsystem: meson
    config-opts:
      - -Ddocs=false
      - -Dvapi=false
      - -D_systemd=false
    sources:
      - type: archive
        url: https://gitlab.gnome.org/GNOME/vte/-/archive/0.76.3/vte-0.76.3.tar.gz
        sha256: eb6d80b879914b89c22811743a5d779fa0e9c57acfa925873b521d054b809746

  # ── fish (compiled from source tag 4.9.2) ──────────────────────────────────
  - name: fish
    buildsystem: cmake-ninja
    build-options:
      build-args:
        - --share=network
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=/app
      - -DWITH_MESSAGE_LOCALIZATION=OFF
    sources:
      - type: archive
        url: https://github.com/fish-shell/fish-shell/archive/refs/tags/4.9.2.tar.gz
        sha256: 13df86468e9a87bfbb5f75dda42800f0aa5c0093511d9e875041e221a4c64be3

  # ── Nerd Fonts Symbols ──────────────────────────────────────────────────────
  - name: nerd-fonts-symbols
    buildsystem: simple
    build-commands:
      - install -Dm644 *.ttf -t /app/share/fonts/nerd-fonts/
    sources:
      - type: archive
        url: https://github.com/ryanoasis/nerd-fonts/releases/download/v3.5.1/NerdFontsSymbolsOnly.zip
        sha256: fdca3682534f6f65e1ccb2345b0362ccf67d9b8eca7c8025330946e93e2473bc

  # ── flux ────────────────────────────────────────────────────────────────────
  - name: flux
    buildsystem: simple
    build-commands:
      - RUSTFLAGS="-L /app/lib" cargo build --release --manifest-path Cargo.toml --offline
      - make install PREFIX=/app
      - install -Dm755 flux-wrapper.sh /app/bin/flux-wrapper
    sources:
      - type: git
        url: https://github.com/killown/flux.git
        branch: main
      - cargo-sources.json
      - type: script
        dest-filename: flux-wrapper.sh
        commands:
          - export PATH="/run/host/usr/bin:/run/host/bin:${PATH}"
          - exec flux-fm "$@"
