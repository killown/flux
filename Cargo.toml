[package]
name = "flux"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
relm4 = { version = "0.11.0", features = ["libadwaita"] }
adw = { package = "libadwaita", version = "0.9.1" }
gtk = { package = "gtk4", version = "0.11.2" }
dirs = "6.0"
rayon = "1.10.0"
tokio = { version = "1.40", features = [
  "rt",
  "rt-multi-thread",
  "process",
  "fs",
  "time",
  "io-util",
] }
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
toml = "1.0"
chrono = "0.4.43"
sha2 = "0.11.0"
xattr = "1.6.1"
imagesize = "0.14.0"
md5 = "0.8.0"
rusqlite = { version = "0.39", features = ["bundled"] }
gio-unix = { version = "0.22.0", package = "gio-unix" }
gdk-pixbuf = "0.22.0"
libc = "0.2.186"
pango = "0.22.6"
pangocairo = "0.22.8"
vte = "0.15.0"
glib = "0.22.8"
gio = "0.22.8"
nix = "0.31.3"
poppler = { version = "0.6", features = ["render"] }
fontconfig = { version = "0.11.0", default-features = false }
indexmap = "2.14.0"
zip = { version = "8.6.0", default-features = false, features = [
  "deflate",
  "bzip2",
  "zstd",
  "aes-crypto",
] }
tar = "0.4"
flate2 = "1"
bzip2 = "0.4"
xz2 = "0.1"
zstd = "0.13"
lz4_flex = "0.11"
sevenz-rust2 = { version = "0.21", features = ["aes256"] }
tempfile = "3"
iso9660_simple = "0.2.7"
bitflags = "2.6"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "flux-fm"
path = "src/main.rs"

[lib]
name = "flux"
path = "src/lib.rs"
