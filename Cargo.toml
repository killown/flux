[package]
name = "flux"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
relm4 = { version = "0.11.0", features = ["libadwaita"] }
adw = { package = "libadwaita", version = "0.9.1" }
gtk = { package = "gtk4", version = "0.11.2" }
dirs = "6.0"
rayon = "1.10.0"
tokio = { version = "1.40", features = ["rt", "rt-multi-thread"] }
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
toml = "1.0"
chrono = "0.4.43"
sha2 = "0.11.0"
xattr = "1.6.1"
imagesize = "0.14.0"
md5 = "0.8.0"
rusqlite = { version = "0.39", features = ["bundled"] }
gio-unix = { version = "0.22.0", package = "gio-unix" }
gdk-pixbuf = "0.22.0"
libc = "0.2.186"
pango = "0.22.6"
pangocairo = "0.22.8"
vte = "0.15.0"
glib = "0.22.8"
gio = "0.22.8"
nix = "0.31.3"
poppler = { version = "0.6", features = ["render"] }
cairo = "0.0.4"
fontconfig = { version = "0.11.0", default-features = false }
indexmap = "2.14.0"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "flux-fm"
path = "src/main.rs"
