name: Release Binary

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tarball:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libadwaita-1-dev \
            libsqlite3-dev \
            libssl-dev \
            libfontconfig-dev \
            libarchive-dev \
            libpoppler-glib-dev \
            libgdk-pixbuf-2.0-dev \
            pkg-config \
            build-essential

      - name: Build Release Binary
        run: cargo build --release

      - name: Package Tarball
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-dev}"
          DIR_NAME="flux-${TAG_NAME}-${{ matrix.arch }}"

          mkdir -p "${DIR_NAME}"

          cp target/release/flux-fm "${DIR_NAME}/"

          if [ -d "data" ]; then
            cp -r data/* "${DIR_NAME}/"
          fi

          cp LICENSE "${DIR_NAME}/" 2>/dev/null || true
          cp README.md "${DIR_NAME}/" 2>/dev/null || true

          tar -czvf "${DIR_NAME}.tar.gz" "${DIR_NAME}"

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: flux-*-${{ matrix.arch }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Built on Arch Linux so the bundled GTK is recent enough for Flux's stylesheet
  # (GTK 4.16+); Ubuntu 24.04 ships GTK 4.14.
  build-appimage:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    env:
      # No FUSE inside the container: run the AppImage tools by extracting them.
      APPIMAGE_EXTRACT_AND_RUN: 1
      # linuxdeploy's bundled strip cannot handle Arch's .relr.dyn sections.
      NO_STRIP: 1
    steps:
      - name: Install Build Dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git rust wget \
            gtk4 libadwaita vte4 sqlite openssl fontconfig libarchive xz \
            poppler-glib gdk-pixbuf2 glib2 \
            librsvg imagemagick fuse2
          pacman -S --noconfirm --needed glib2-devel || true

      - uses: actions/checkout@v4

      - name: Mark workspace as a safe git directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build AppImage
        run: ./packaging/appimg/build_appimage.sh

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: packaging/appimg/Flux-x86_64.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
